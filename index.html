<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snoser</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
html, body { height:100%; }
body {
  background:#000; color:#fff; overflow:hidden;
  display:flex; justify-content:center; align-items:center;
}
.screen {
  display:none; flex-direction:column; align-items:center; justify-content:center;
  width:100%; max-width:420px; height:100vh; max-height:100vh;
  padding:24px; overflow:hidden; position:relative;
}
.screen.active { display:flex; }

/* ---------- HUD (снизу) ---------- */
.hud {
  position:fixed; bottom:16px; left:0; right:0;
  max-width:420px; margin:0 auto;
  display:flex; justify-content:space-between; align-items:center;
  padding:0 24px; pointer-events:none;
  z-index:50;
}
.hud-left, .hud-right { pointer-events:auto; }
.snos-counter {
  background:#0a0a0a; border:1px solid #222;
  padding:8px 14px; border-radius:20px;
  font-size:12px; color:#aaa; letter-spacing:.5px;
  font-family:"SF Mono",Menlo,monospace;
}
.snos-counter b { color:#fff; font-weight:700; }

.premium-btn {
  width:40px; height:40px; border-radius:50%;
  background:linear-gradient(135deg,#1a1a1a,#0a0a0a);
  border:1px solid #333;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all .2s;
}
.premium-btn:hover { border-color:#666; }
.premium-btn svg { width:18px; height:18px; }

/* ---------- Главный экран ---------- */
.logo {
  font-size:48px; font-weight:800; letter-spacing:2px; margin-bottom:8px;
  background:linear-gradient(90deg,#fff,#888);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
}
.subtitle {
  color:#666; margin-bottom:40px; font-size:14px;
  letter-spacing:1px; text-transform:uppercase;
}
.platforms { display:flex; flex-direction:column; gap:14px; width:100%; }
.platform-btn {
  background:#0a0a0a; border:1px solid #222; color:#fff;
  padding:18px; border-radius:12px; font-size:16px; font-weight:600;
  cursor:pointer; transition:all .2s;
}
.platform-btn:hover { background:#111; border-color:#444; }
.platform-btn:active { transform:scale(.98); }

/* ---------- Экран ввода ---------- */
.back-btn {
  align-self:flex-start; background:none; border:none; color:#666;
  font-size:14px; cursor:pointer; margin-bottom:24px; padding:8px 0;
}
.back-btn:hover { color:#fff; }
.screen-title { font-size:20px; margin-bottom:24px; font-weight:600; text-align:center; }
.target-input {
  width:100%; background:#0a0a0a; border:1px solid #222; color:#fff;
  padding:16px; border-radius:12px; font-size:16px; outline:none;
  margin-bottom:16px; transition:border-color .2s;
}
.target-input:focus { border-color:#555; }
.snos-btn {
  width:100%; background:#fff; color:#000; border:none;
  padding:16px; border-radius:12px; font-size:16px; font-weight:700;
  cursor:pointer; letter-spacing:1px; transition:opacity .2s;
}
.snos-btn:hover { opacity:.85; }
.snos-btn:active { transform:scale(.98); }

/* ---------- Лоадер процесса ---------- */
.process-wrap {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:24px; width:100%;
}
.loader {
  position:relative;
  width:120px; height:120px;
  display:flex; align-items:center; justify-content:center;
}
.loader-ring {
  position:absolute; inset:0;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.08);
}
.loader-spin {
  position:absolute; inset:0;
  border-radius:50%;
  border:2px solid transparent;
  border-top-color:#fff;
  animation:spin 1.1s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.loader-dot {
  position:absolute; inset:14px;
  border-radius:50%;
  background:rgba(255,255,255,.03);
}
.loader-text {
  position:relative;
  z-index:2;
  text-align:center;
  font-size:13px;
  color:#ccc;
  padding:0 20px;
  line-height:1.4;
  font-family:"SF Mono",Menlo,monospace;
}
.process-status {
  font-size:12px;
  color:#555;
  letter-spacing:2px;
  text-transform:uppercase;
  font-family:"SF Mono",Menlo,monospace;
}

/* ---------- Финальный экран ---------- */
.final-screen {
  width:100%; height:100%;
  display:flex; flex-direction:column;
  overflow-y:auto;
}
.final-screen::-webkit-scrollbar { width:4px; }
.final-screen::-webkit-scrollbar-thumb { background:#222; border-radius:2px; }

.final-header {
  text-align:center;
  padding:20px 0 16px;
  border-bottom:1px solid #1a1a1a;
  margin-bottom:16px;
  flex-shrink:0;
}
.final-icon {
  width:56px; height:56px; border-radius:50%;
  background:rgba(74,222,128,.12);
  border:1px solid rgba(74,222,128,.4);
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 12px;
}
.final-icon svg { width:26px; height:26px; }
.final-title {
  font-size:20px; font-weight:700; color:#4ade80;
  letter-spacing:1px; margin-bottom:4px;
}
.final-sub {
  font-size:12px; color:#666; letter-spacing:1px; text-transform:uppercase;
}
.final-body {
  display:flex; flex-direction:column; gap:12px;
  padding:0 4px 20px; flex:1;
}
.info-card {
  background:#0a0a0a; border:1px solid #1a1a1a;
  border-radius:10px; padding:14px;
}
.info-card .label {
  font-size:10px; color:#555; letter-spacing:1.5px;
  text-transform:uppercase; margin-bottom:8px;
  font-family:"SF Mono",Menlo,monospace;
}
.info-card .value {
  font-size:14px; color:#ddd; line-height:1.5;
  font-family:"SF Mono",Menlo,monospace;
  word-break:break-all;
}
.info-card .value .green { color:#4ade80; }
.info-card .value .dim   { color:#666; }

.report-list {
  list-style:none; display:flex; flex-direction:column; gap:6px;
  font-family:"SF Mono",Menlo,monospace; font-size:12px;
}
.report-list li {
  display:flex; justify-content:space-between;
  color:#aaa; padding:4px 0;
  border-bottom:1px dashed #1a1a1a;
}
.report-list li:last-child { border-bottom:none; }
.report-list li span:last-child { color:#4ade80; }

.final-footer {
  padding:16px 0 20px; flex-shrink:0;
  border-top:1px solid #1a1a1a;
}
.final-home-btn {
  width:100%; background:#fff; color:#000; border:none;
  padding:16px; border-radius:12px; font-size:16px; font-weight:700;
  cursor:pointer;
}
.final-home-btn:hover { opacity:.85; }
.final-home-btn.fail {
  background:#1a1a1a; color:#f87171; border:1px solid #f87171;
}
  /* ---------- Тарифы ---------- */
.tariffs {
  display:flex; flex-direction:column; gap:14px; width:100%;
}
.tariff-card {
  background:#0a0a0a; border:1px solid #222;
  border-radius:14px; padding:18px;
  display:flex; justify-content:space-between; align-items:center;
  cursor:pointer; transition:all .2s;
}
.tariff-card:hover { border-color:#555; background:#111; }
.tariff-left { display:flex; flex-direction:column; gap:4px; }
.tariff-name { font-size:16px; font-weight:700; }
.tariff-sub { font-size:11px; color:#666; letter-spacing:1px; text-transform:uppercase; }
.tariff-price {
  font-size:18px; font-weight:700;
  font-family:"SF Mono",Menlo,monospace;
}

/* ---------- Оплата ---------- */
.pay-form { width:100%; display:flex; flex-direction:column; gap:14px; }
.pay-field {
  background:#0a0a0a; border:1px solid #222;
  border-radius:12px; padding:14px 16px;
  display:flex; flex-direction:column; gap:6px;
  transition:border-color .2s;
}
.pay-field:focus-within { border-color:#555; }
.pay-field label {
  font-size:10px; color:#555; letter-spacing:1.5px;
  text-transform:uppercase;
  font-family:"SF Mono",Menlo,monospace;
}
.pay-field input {
  background:none; border:none; color:#fff;
  font-size:15px; outline:none;
  font-family:"SF Mono",Menlo,monospace;
  letter-spacing:1px;
}
.pay-row { display:flex; gap:14px; }
.pay-row .pay-field { flex:1; }
.pay-error {
  color:#f87171; font-size:12px;
  font-family:"SF Mono",Menlo,monospace;
  min-height:16px;
}

/* ---------- Одобрение оплаты ---------- */
.approve-wrap {
  display:flex; flex-direction:column; align-items:center; gap:20px;
  text-align:center;
}
.approve-icon {
  width:72px; height:72px; border-radius:50%;
  background:rgba(74,222,128,.12);
  border:1px solid rgba(74,222,128,.4);
  display:flex; align-items:center; justify-content:center;
  animation:pop .4s ease-out;
}
.approve-icon svg { width:34px; height:34px; }
@keyframes pop {
  0% { transform:scale(.5); opacity:0; }
  100% { transform:scale(1); opacity:1; }
}
.approve-title { font-size:20px; font-weight:700; color:#4ade80; }
.approve-sub { font-size:13px; color:#888; font-family:"SF Mono",Menlo,monospace; }
.approve-amount { font-size:24px; font-weight:800; font-family:"SF Mono",Menlo,monospace; }
</style>
</head>
<body>

<!-- Главный экран -->
<div class="screen active" id="screen-main">
  <h1 class="logo">Snoser</h1>
  <p class="subtitle">Выберите платформу</p>
  <div class="platforms">
    <button class="platform-btn" data-platform="telegram">Telegram</button>
    <button class="platform-btn" data-platform="whatsapp">WhatsApp</button>
    <button class="platform-btn" data-platform="max">Max</button>
    <button class="platform-btn" data-platform="site">Сайт https://</button>
  </div>
</div>

<!-- Ввод -->
<div class="screen" id="screen-input">
  <button class="back-btn" id="back-to-main">← Назад</button>
  <h2 class="screen-title" id="input-title">Введите данные</h2>
  <input type="text" id="target-input" class="target-input" autocomplete="off">
  <button class="snos-btn" id="snos-btn">Snos</button>
</div>

<!-- Процесс -->
<div class="screen" id="screen-process">
  <div class="process-wrap">
    <div class="loader">
      <div class="loader-ring"></div>
      <div class="loader-spin"></div>
      <div class="loader-dot"></div>
      <div class="loader-text" id="loader-text">Поиск данных</div>
    </div>
    <div class="process-status" id="process-status">processing</div>
  </div>
</div>

<!-- Финал -->
<div class="screen" id="screen-final">
  <div class="final-screen" id="final-screen"></div>
</div>

<!-- Тарифы -->
<div class="screen" id="screen-tariffs">
  <button class="back-btn" id="tariffs-back">← Назад</button>
  <h2 class="screen-title">Пополнение Snos</h2>
  <div class="tariffs">
    <div class="tariff-card" data-amount="10" data-price="199">
      <div class="tariff-left">
        <div class="tariff-name">10 Snos</div>
        <div class="tariff-sub">Стартовый</div>
      </div>
      <div class="tariff-price">199 ₽</div>
    </div>
    <div class="tariff-card" data-amount="50" data-price="399">
      <div class="tariff-left">
        <div class="tariff-name">50 Snos</div>
        <div class="tariff-sub">Оптимальный</div>
      </div>
      <div class="tariff-price">399 ₽</div>
    </div>
    <div class="tariff-card" data-amount="100" data-price="799">
      <div class="tariff-left">
        <div class="tariff-name">100 Snos</div>
        <div class="tariff-sub">Максимум</div>
      </div>
      <div class="tariff-price">799 ₽</div>
    </div>
  </div>
</div>

<!-- Оплата -->
<div class="screen" id="screen-pay">
  <button class="back-btn" id="pay-back">← Назад</button>
  <h2 class="screen-title" id="pay-title">Оплата</h2>
  <div class="pay-form">
    <div class="pay-field">
      <label>Номер карты</label>
      <input type="text" id="card-num" inputmode="numeric" maxlength="19" placeholder="0000 0000 0000 0000">
    </div>
    <div class="pay-row">
      <div class="pay-field">
        <label>Срок</label>
        <input type="text" id="card-exp" maxlength="5" placeholder="MM/YY">
      </div>
      <div class="pay-field">
        <label>CVV</label>
        <input type="text" id="card-cvv" inputmode="numeric" maxlength="3" placeholder="•••">
      </div>
    </div>
    <div class="pay-error" id="pay-error"></div>
    <button class="snos-btn" id="pay-submit">Оплатить</button>
  </div>
</div>

<!-- Одобрение -->
<div class="screen" id="screen-approve">
  <div class="approve-wrap">
    <div class="approve-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <div class="approve-title">Оплата одобрена</div>
    <div class="approve-amount" id="approve-amount">+10 Snos</div>
    <div class="approve-sub" id="approve-sub">Баланс обновлён</div>
  </div>
</div>

<!-- HUD -->
<div class="hud">
  <div class="hud-left">
    <div class="snos-counter">Доступно <b id="snos-count">3</b> snosa</div>
  </div>
  <div class="hud-right">
    <div class="premium-btn" id="premium-btn" title="Premium">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7l3 3 6-6 6 6 3-3v10H3V7z"/>
      </svg>
    </div>
  </div>
</div>
   <script>
const screens = {
  main:     document.getElementById('screen-main'),
  input:    document.getElementById('screen-input'),
  process:  document.getElementById('screen-process'),
  final:    document.getElementById('screen-final'),
  tariffs:  document.getElementById('screen-tariffs'),
  pay:      document.getElementById('screen-pay'),
  approve:  document.getElementById('screen-approve'),
};

const inputTitle     = document.getElementById('input-title');
const targetInput    = document.getElementById('target-input');
const snosBtn        = document.getElementById('snos-btn');
const loaderText     = document.getElementById('loader-text');
const processStatus  = document.getElementById('process-status');
const finalScreen    = document.getElementById('final-screen');
const snosCountEl    = document.getElementById('snos-count');
const payTitle       = document.getElementById('pay-title');
const payError       = document.getElementById('pay-error');
const approveAmount  = document.getElementById('approve-amount');
const approveSub     = document.getElementById('approve-sub');

let currentPlatform = null;
let snosBalance = 3;
let timers = [];
let selectedTariff = null;

const SEARCH_MS = 30000;
const STEP_MS   = 20000;

const PLATFORM_CONFIG = {
  telegram: {
    title: 'Введите @username',
    placeholder: '@username',
    steps: [
      { text: 'Поиск данных',      duration: SEARCH_MS },
      { text: 'Данные найдены',    duration: STEP_MS },
      { text: 'Отправка жалоб',    duration: STEP_MS },
      { text: 'Жалобы отправлены', duration: STEP_MS },
      { text: 'Аккаунт удален',    duration: STEP_MS, final: 'success' },
    ],
    failSteps: [
      { text: 'Поиск данных',      duration: SEARCH_MS },
      { text: 'Данные найдены',    duration: STEP_MS },
      { text: 'Отправка жалоб',    duration: STEP_MS },
      { text: 'Жалобы отклонены',  duration: STEP_MS, final: 'fail' },
    ],
  },
  whatsapp: {
    title: 'Введите номер телефона',
    placeholder: '+7 999 000-00-00',
    steps: [
      { text: 'Поиск данных',      duration: SEARCH_MS },
      { text: 'Данные найдены',    duration: STEP_MS },
      { text: 'Отправка жалоб',    duration: STEP_MS },
      { text: 'Жалобы отправлены', duration: STEP_MS },
      { text: 'Аккаунт удален',    duration: STEP_MS, final: 'success' },
    ],
    failSteps: [
      { text: 'Поиск данных',      duration: SEARCH_MS },
      { text: 'Данные найдены',    duration: STEP_MS },
      { text: 'Отправка жалоб',    duration: STEP_MS },
      { text: 'Жалобы отклонены',  duration: STEP_MS, final: 'fail' },
    ],
  },
  max: {
    title: 'Введите @username',
    placeholder: '@username',
    steps: [
      { text: 'Поиск данных',      duration: SEARCH_MS },
      { text: 'Данные найдены',    duration: STEP_MS },
      { text: 'Отправка жалоб',    duration: STEP_MS },
      { text: 'Жалобы отправлены', duration: STEP_MS },
      { text: 'Аккаунт удален',    duration: STEP_MS, final: 'success' },
    ],
    failSteps: [
      { text: 'Поиск данных',      duration: SEARCH_MS },
      { text: 'Данные найдены',    duration: STEP_MS },
      { text: 'Отправка жалоб',    duration: STEP_MS },
      { text: 'Жалобы отклонены',  duration: STEP_MS, final: 'fail' },
    ],
  },
  site: {
    title: 'Введите ссылку на сайт',
    placeholder: 'https://example.com',
    steps: [
      { text: 'Поиск данных сайта',              duration: SEARCH_MS },
      { text: 'Сайт найден',                     duration: STEP_MS },
      { text: 'Поиск уязвимости',                duration: STEP_MS },
      { text: 'Уязвимость найдена',              duration: STEP_MS },
      { text: 'Удаление сайта через уязвимость', duration: STEP_MS },
      { text: 'Сайт удален',                     duration: STEP_MS, final: 'success' },
    ],
    failSteps: [
      { text: 'Поиск данных сайта',            duration: SEARCH_MS },
      { text: 'Сайт найден',                   duration: STEP_MS },
      { text: 'Поиск уязвимости',              duration: STEP_MS },
      { text: 'Уязвимость не найдена',         duration: STEP_MS },
      { text: 'Поиск альтернативного способа', duration: STEP_MS },
      { text: 'Способ найден',                 duration: STEP_MS },
      { text: 'Сайт удален',                   duration: STEP_MS, final: 'success' },
    ],
  },
};

function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
}
function clearTimers() {
  timers.forEach(t => { clearTimeout(t); clearInterval(t); });
  timers = [];
}
function updateSnosUI() { snosCountEl.textContent = snosBalance; }

function resetApp() {
  clearTimers();
  finalScreen.innerHTML = '';
  targetInput.value = '';
  currentPlatform = null;
  payError.textContent = '';
  document.getElementById('card-num').value = '';
  document.getElementById('card-exp').value = '';
  document.getElementById('card-cvv').value = '';
}

/* ---------- Навигация ---------- */
document.querySelectorAll('.platform-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentPlatform = btn.dataset.platform;
    const cfg = PLATFORM_CONFIG[currentPlatform];
    inputTitle.textContent = cfg.title;
    targetInput.placeholder = cfg.placeholder;
    targetInput.value = '';
    showScreen('input');
    targetInput.focus();
  });
});

document.getElementById('back-to-main').addEventListener('click', () => {
  showScreen('main'); targetInput.value = '';
});
document.getElementById('premium-btn').addEventListener('click', () => showScreen('tariffs'));
document.getElementById('tariffs-back').addEventListener('click', () => showScreen('main'));
document.getElementById('pay-back').addEventListener('click', () => showScreen('tariffs'));

/* ---------- Тарифы ---------- */
document.querySelectorAll('.tariff-card').forEach(card => {
  card.addEventListener('click', () => {
    selectedTariff = {
      amount: parseInt(card.dataset.amount, 10),
      price:  parseInt(card.dataset.price, 10),
    };
    payTitle.textContent = `Оплата ${selectedTariff.amount} Snos · ${selectedTariff.price} ₽`;
    payError.textContent = '';
    document.getElementById('card-num').value = '';
    document.getElementById('card-exp').value = '';
    document.getElementById('card-cvv').value = '';
    showScreen('pay');
  });
});

/* ---------- Маска карты ---------- */
const cardNumInput = document.getElementById('card-num');
cardNumInput.addEventListener('input', e => {
  let v = e.target.value.replace(/\D/g, '').slice(0, 16);
  v = v.replace(/(.{4})/g, '$1 ').trim();
  e.target.value = v;
});
const cardExpInput = document.getElementById('card-exp');
cardExpInput.addEventListener('input', e => {
  let v = e.target.value.replace(/\D/g, '').slice(0, 4);
  if (v.length >= 3) v = v.slice(0,2) + '/' + v.slice(2);
  e.target.value = v;
});
const cardCvvInput = document.getElementById('card-cvv');
cardCvvInput.addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 3);
});

/* ---------- Оплата ---------- */
document.getElementById('pay-submit').addEventListener('click', () => {
  const num = cardNumInput.value.replace(/\s/g, '');
  const exp = cardExpInput.value;
  const cvv = cardCvvInput.value;
  payError.textContent = '';

  if (num.length < 16) { payError.textContent = 'Введите 16 цифр номера карты'; return; }
  if (num[0] === '0' || num[0] === '1') {
    payError.textContent = 'Номер карты не может начинаться с 0 или 1'; return;
  }
  if (!/^\d{2}\/\d{2}$/.test(exp)) { payError.textContent = 'Неверный срок действия'; return; }
  const mm = parseInt(exp.slice(0,2), 10);
  if (mm < 1 || mm > 12) { payError.textContent = 'Неверный месяц'; return; }
  if (cvv.length !== 3) { payError.textContent = 'Введите CVV'; return; }

  const submitBtn = document.getElementById('pay-submit');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Обработка...';

  timers.push(setTimeout(() => {
    snosBalance += selectedTariff.amount;
    updateSnosUI();
    approveAmount.textContent = '+' + selectedTariff.amount + ' Snos';
    approveSub.textContent = 'Баланс: ' + snosBalance + ' Snos';
    showScreen('approve');

    timers.push(setTimeout(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Оплатить';
      showScreen('main');
    }, 2500));
  }, 5000));
});

/* ---------- Утилиты финального экрана ---------- */
function randHex(len) {
  const c = '0123456789abcdef';
  let s = '';
  for (let i = 0; i < len; i++) s += c[Math.floor(Math.random()*16)];
  return s;
}
function randInt(min, max) { return Math.floor(Math.random()*(max-min+1))+min; }
function nowStamp() {
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

const ICON_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
const ICON_CROSS = `<svg viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;

function renderFinalScreen(platform, target, isFail) {
  const platformNames = { telegram:'Telegram', whatsapp:'WhatsApp', max:'Max', site:'Web Site' };
  const pName = platformNames[platform] || platform;
  const isSite = platform === 'site';
  const caseId  = 'SN-' + randHex(4).toUpperCase() + '-' + randHex(4).toUpperCase();
  const startedAt = nowStamp();
  const procTime = `${randInt(1,2)} мин ${randInt(10,59)} сек`;

  finalScreen.innerHTML = '';

  if (isFail) {
    finalScreen.innerHTML = `
      <div class="final-header">
        <div class="final-icon" style="background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.4);">${ICON_CROSS}</div>
        <div class="final-title" style="color:#f87171;">Операция отклонена</div>
        <div class="final-sub">Case ${caseId}</div>
      </div>
      <div class="final-body">
        <div class="info-card"><div class="label">Платформа</div><div class="value">${pName}</div></div>
        <div class="info-card"><div class="label">Цель</div><div class="value">${target}</div></div>
        <div class="info-card"><div class="label">Причина</div><div class="value dim">Часть жалоб отклонена модерацией. Требуется повторная подача с расширенным пакетом доказательств.</div></div>
        <div class="info-card"><div class="label">Сессия</div>
          <ul class="report-list">
            <li><span>Начало</span><span>${startedAt}</span></li>
            <li><span>Длительность</span><span>${procTime}</span></li>
            <li><span>Статус</span><span style="color:#f87171;">REJECTED</span></li>
          </ul>
        </div>
      </div>
      <div class="final-footer"><button class="final-home-btn fail" id="final-home">На главный экран</button></div>
    `;
  } else {
    const accountId = randHex(16);
    const region = ['RU-MOW','RU-SPB','RU-NSK','EU-DE','EU-NL','US-CA'][randInt(0,5)];
    const ip = `${randInt(10,220)}.${randInt(0,255)}.${randInt(0,255)}.${randInt(1,254)}`;
    const node = 'node-' + randHex(6);
    const doneCount = randInt(148, 412);

    const siteBlock = isSite ? `
      <div class="info-card"><div class="label">Вектор</div><div class="value">CVE-${randInt(2020,2026)}-${randInt(1000,9999)} · CVSS ${(Math.random()*3+7).toFixed(1)}</div></div>
      <div class="info-card"><div class="label">Уязвимость</div><div class="value">SQL Injection в параметре <span class="green">?id=</span></div></div>
      <div class="info-card"><div class="label">Хост</div><div class="value">${target.replace(/^https?:\/\//,'').split('/')[0]}</div></div>
    ` : `
      <div class="info-card"><div class="label">Идентификатор</div><div class="value">${accountId}</div></div>
      <div class="info-card"><div class="label">Регион</div><div class="value">${region}</div></div>
      <div class="info-card"><div class="label">Последний IP</div><div class="value">${ip}</div></div>
    `;

    finalScreen.innerHTML = `
      <div class="final-header">
        <div class="final-icon">${ICON_CHECK}</div>
        <div class="final-title">${isSite ? 'САЙТ УДАЛЕН' : 'АККАУНТ УДАЛЕН'}</div>
        <div class="final-sub">Case ${caseId}</div>
      </div>
      <div class="final-body">
        <div class="info-card"><div class="label">Платформа</div><div class="value">${pName}</div></div>
        <div class="info-card"><div class="label">${isSite ? 'Целевой URL' : 'Целевой аккаунт'}</div><div class="value">${target}</div></div>
        ${siteBlock}
        <div class="info-card"><div class="label">Жалобы / запросы</div>
          <ul class="report-list">
            <li><span>Подано</span><span>${doneCount}</span></li>
            <li><span>Принято модерацией</span><span>${doneCount}</span></li>
            <li><span>Отклонено</span><span>0</span></li>
            <li><span>Приоритет</span><span>${['HIGH','CRITICAL'][randInt(0,1)]}</span></li>
          </ul>
        </div>
        <div class="info-card"><div class="label">Сессия</div>
          <ul class="report-list">
            <li><span>Начало</span><span>${startedAt}</span></li>
            <li><span>Длительность</span><span>${procTime}</span></li>
            <li><span>Узел</span><span>${node}</span></li>
            <li><span>Статус</span><span>${isSite ? 'SITE REMOVED' : 'ACCOUNT REMOVED'}</span></li>
          </ul>
        </div>
      </div>
      <div class="final-footer"><button class="final-home-btn" id="final-home">На главный экран</button></div>
    `;
  }

  document.getElementById('final-home').addEventListener('click', () => {
    resetApp();
    showScreen('main');
  });
}

/* ---------- Запуск процесса ---------- */
snosBtn.addEventListener('click', () => {
  const value = targetInput.value.trim();
  if (!value) { targetInput.focus(); return; }
  if (snosBalance <= 0) { showScreen('tariffs'); return; }

  const cfg = PLATFORM_CONFIG[currentPlatform];
  const isFail = Math.random() < 0.25;
  const steps = isFail ? cfg.failSteps : cfg.steps;

  snosBalance -= 1;
  updateSnosUI();

  showScreen('process');
  clearTimers();

  let elapsed = 0;
  const totalSteps = steps.length;

  steps.forEach((step, i) => {
    const t = setTimeout(() => {
      loaderText.textContent = step.text;
      processStatus.textContent = `processing ${i+1}/${totalSteps}`;
    }, elapsed);
    timers.push(t);
    elapsed += step.duration;
  });

  const finalT = setTimeout(() => {
    const lastStep = steps[steps.length - 1];
    renderFinalScreen(currentPlatform, value, lastStep.final === 'fail');
    showScreen('final');
  }, elapsed);
  timers.push(finalT);
});

updateSnosUI();
</script>
